<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kairox Pay | Set your password</title>
  <style>
    :root { --teal: #0a8782; --teal-soft: #e3f5f3; --navy: #0f1536; --muted: #566078; --line: #aab6c4; --error: #b91c1c; --ok: #087b4d; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: var(--navy);
      background: radial-gradient(52% 50% at 56% -8%, rgba(112, 212, 203, 0.30), rgba(112, 212, 203, 0) 72%), #f7fbfc;
    }
    .card { width: min(440px, 100%); padding: 34px 32px; background: #fff; border: 1px solid #dbe6ea; border-radius: 18px; box-shadow: 0 10px 40px rgba(15, 21, 54, .08); }
    h1 { margin: 0 0 8px; font-size: 1.6rem; letter-spacing: -.02em; }
    p { margin: 0 0 18px; color: var(--muted); line-height: 1.5; }
    label { display: block; margin: 0 0 6px; font-weight: 700; font-size: .92rem; }
    .field { margin: 0 0 16px; }
    .pw { position: relative; }
    input { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; font: inherit; color: inherit; background: #fff; }
    input:focus { outline: 3px solid rgba(20, 179, 166, .35); border-color: var(--teal); }
    .toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--teal); font-weight: 700; cursor: pointer; padding: 6px 8px; }
    button.primary { width: 100%; padding: 14px; border: 0; border-radius: 12px; background: var(--teal); color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
    button.primary:disabled { opacity: .6; cursor: default; }
    #message { min-height: 22px; margin: 0 0 12px; font-weight: 700; }
    #message.error { color: var(--error); }
    #message.ok { color: var(--ok); }
    .hint { font-size: .85rem; color: var(--muted); margin-top: 6px; }
    a { color: var(--teal); font-weight: 700; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="title">Set your password</h1>
    <p id="intro">Choose a password to finish setting up your Kairox Pay login.</p>
    <div id="message" role="status"></div>

    <form id="passwordForm" novalidate hidden>
      <div class="field">
        <label for="newPassword">New password</label>
        <div class="pw"><input id="newPassword" type="password" autocomplete="new-password" minlength="8"><button class="toggle" id="toggleShow" type="button" aria-label="Show or hide the password">Show</button></div>
        <div class="hint">At least 8 characters, with a letter and a number.</div>
      </div>
      <div class="field">
        <label for="confirmPassword">Type it again</label>
        <input id="confirmPassword" type="password" autocomplete="new-password">
      </div>
      <button class="primary" id="saveButton" type="submit">Save password</button>
    </form>

    <p id="backLink" hidden style="margin:18px 0 0"><a href="login.html">Go to sign in</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
  <script src="js/supabase.js"></script>
  <script>
    // Handles both kinds of link Supabase emails: an invitation to a new login, and a "forgot password" reset.
    // Either arrives with a one-time token. Once it is accepted the person is signed in for a moment and can choose a password.
    const spEl = (id) => document.getElementById(id);

    function spMessage(text, kind) {
      const box = spEl("message");
      box.textContent = text || "";
      box.className = kind || "";
    }

    function spShowForm(show) {
      spEl("passwordForm").hidden = !show;
      spEl("backLink").hidden = show;
    }

    // At least 8 characters with a letter and a number.
    function spCheck(password, again) {
      if (password.length < 8) return "Please use at least 8 characters.";
      if (!/[A-Za-z]/.test(password) || !/[0-9]/.test(password)) return "Please include at least one letter and one number.";
      if (password !== again) return "The two passwords do not match.";
      return "";
    }

    function spFriendly(message) {
      const m = String(message || "");
      if (/expired|invalid|already been used|not found/i.test(m)) return "This link has expired or has already been used. Ask your employer to send a new invitation, or use Forgot password on the sign-in page.";
      if (/same as the old|different from the old/i.test(m)) return "Please choose a password you have not used before.";
      if (/weak|at least/i.test(m)) return "That password is too easy to guess. Please choose a longer one.";
      return m || "Something went wrong. Please try again.";
    }

    async function spStart() {
      const query = new URLSearchParams(window.location.search);
      const tokenHash = query.get("token_hash");
      const type = query.get("type");

      try {
        // A link from the email template: swap the one-time token for a short session.
        if (tokenHash && ["invite", "recovery", "signup", "magiclink", "email"].includes(type)) {
          const { error } = await supabaseClient.auth.verifyOtp({ token_hash: tokenHash, type });

          if (error) {
            spMessage(spFriendly(error.message), "error");
            spShowForm(false);
            return;
          }
        }

        // Otherwise the session was started from the link's own tokens (supabase-js reads them from the address).
        const { data } = await supabaseClient.auth.getSession();

        if (!data || !data.session) {
          spMessage("This page opens from the link in your invitation or password reset email. If you have a password already, sign in instead.", "error");
          spShowForm(false);
          return;
        }

        spEl("intro").textContent = `Choose a password for ${data.session.user && data.session.user.email ? data.session.user.email : "your login"}.`;
        spShowForm(true);
        spEl("newPassword").focus();
      } catch (error) {
        console.error("Set password could not start:", error);
        spMessage("Something went wrong. Please try the link again.", "error");
        spShowForm(false);
      }
    }

    spEl("toggleShow").addEventListener("click", () => {
      const hidden = spEl("newPassword").type === "password";
      spEl("newPassword").type = hidden ? "text" : "password";
      spEl("confirmPassword").type = hidden ? "text" : "password";
      spEl("toggleShow").textContent = hidden ? "Hide" : "Show";
    });

    spEl("passwordForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      spMessage("");

      const problem = spCheck(spEl("newPassword").value, spEl("confirmPassword").value);

      if (problem) {
        spMessage(problem, "error");
        return;
      }

      const button = spEl("saveButton");
      button.disabled = true;

      const { error } = await supabaseClient.auth.updateUser({ password: spEl("newPassword").value });

      button.disabled = false;

      if (error) {
        spMessage(spFriendly(error.message), "error");
        return;
      }

      spMessage("Your password is saved. Taking you in…", "ok");
      spShowForm(true);
      spEl("passwordForm").hidden = true;
      window.setTimeout(() => { window.location.href = "login.html"; }, 900);
    });

    spStart();
  </script>
</body>
</html>
